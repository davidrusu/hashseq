[package]
name = "hashweb-sync"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
hashseq = { path = ".." }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs"] }
tower-http = { version = "0.6", features = ["fs"] }
