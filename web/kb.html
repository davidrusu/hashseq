<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HashWeb — Knowledge Base</title>
<style>
  @font-face { font-family:'PM'; font-weight:400; src:url('./fonts/ibm-plex-mono-400.woff2') format('woff2'); }
  @font-face { font-family:'PM'; font-weight:500; src:url('./fonts/ibm-plex-mono-500.woff2') format('woff2'); }
  @font-face { font-family:'PM'; font-weight:600; src:url('./fonts/ibm-plex-mono-600.woff2') format('woff2'); }

  :root {
    --paper:#EFE9DB; --paper2:#F6F1E5; --ink:#1B1816; --muted:#7C7361;
    --red:#B23A2E; --green:#2F5D43; --amber:#C8782D; --grid:#D2C8B2; --line:#1B1816;
    --blue:#3F5C86;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    font-family:'PM','IBM Plex Mono',monospace; color:var(--ink); background:var(--paper);
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
    background-image:radial-gradient(var(--grid) 0.7px, transparent 0.7px);
    background-size:22px 22px;
  }
  header {
    display:flex; align-items:baseline; justify-content:space-between;
    padding:10px 16px; border-bottom:1.25px solid var(--line); background:rgba(239,233,219,0.9);
  }
  header .brand { font-weight:600; letter-spacing:3px; font-size:12px; }
  header .fig { color:var(--muted); font-size:11px; letter-spacing:1px; }
  header .h-left, header .h-right { display:flex; align-items:center; gap:12px; }
  #nav-toggle, #comments-toggle { font-size:13px; padding:3px 8px; }
  body.collapse-nav #sidebar { display:none; }
  #panel-backdrop {
    display:none; position:fixed; inset:0; z-index:15;
    background:rgba(27,24,22,0.25);
  }

  /* ---- responsive: panels collapse into slide-in overlays ---- */
  @media (max-width: 1150px) {
    #comments {
      position:fixed; top:0; right:0; bottom:0; z-index:20;
      transform:translateX(100%); transition:transform 0.18s ease-out;
      box-shadow:-4px 0 14px rgba(27,24,22,0.25);
    }
    body.show-comments #comments { transform:none; background:var(--paper2); }
    body.show-comments #panel-backdrop { display:block; }
  }
  @media (max-width: 900px) {
    body.collapse-nav #sidebar { display:flex; } /* overlay mode overrides collapse */
    #sidebar {
      position:fixed; top:0; left:0; bottom:0; z-index:20;
      transform:translateX(-100%); transition:transform 0.18s ease-out;
      box-shadow:4px 0 14px rgba(27,24,22,0.25);
    }
    body.show-nav #sidebar { transform:none; background:var(--paper2); }
    body.show-nav #panel-backdrop, body.show-comments #panel-backdrop { display:block; }
    header .fig { display:none; }
    #crumbs, #title { padding-left:14px; }
    #fmt-row, #work { margin-left:12px; margin-right:12px; }
    #page-tools { padding-left:12px; }
  }
  @media (max-width: 640px) {
    #fmt-tools { flex-wrap:wrap; }
    .fig { display:none; }
  }

  main { flex:1; display:flex; min-height:0; }

  /* ---- sidebar ---- */
  #sidebar {
    width:280px; min-width:280px; border-right:1.25px solid var(--line);
    background:rgba(246,241,229,0.92); display:flex; flex-direction:column;
  }
  #sidebar .side-head {
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 12px; border-bottom:1px solid var(--line);
    font-size:11px; letter-spacing:2px; color:var(--muted); font-weight:600;
  }
  button {
    font-family:inherit; font-size:11px; color:var(--ink); background:var(--paper2);
    border:1px solid var(--ink); padding:3px 9px; cursor:pointer; letter-spacing:0.5px;
  }
  button:hover { background:#ece5d3; }
  #tree { flex:1; overflow-y:auto; padding:6px 0; font-size:13px; }
  .page-row {
    display:flex; align-items:center; gap:6px; padding:4px 12px; cursor:pointer;
    border-left:3px solid transparent; user-select:none;
  }
  .page-row:hover { background:#ece5d3; }
  .page-row.active { border-left-color:var(--red); background:#ece5d3; font-weight:600; }
  .page-row .twirl { color:var(--muted); width:12px; text-align:center; flex:none; }
  .page-row .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .page-row .sub { color:var(--muted); font-size:10px; }
  .page-row.drop-above::before {
    content:''; position:absolute; top:0; left:12px; right:0; height:0;
    border-top:2px solid var(--red);
  }
  .page-row.drop-below::after {
    content:''; position:absolute; bottom:0; left:12px; right:0; height:0;
    border-top:2px solid var(--red);
  }
  .page-row { position:relative; }
  .page-row .twirl { cursor:grab; }
  .page-row.dragging { opacity:0.4; }
  .page-row.drop-into { box-shadow:inset 0 0 0 2px var(--red); background:#ece5d3; }
  .empty-note { color:var(--muted); font-size:12px; padding:14px; letter-spacing:0.5px; }

  /* ---- editor ---- */
  #editor-pane { flex:1; display:flex; flex-direction:column; min-width:0; }
  #crumbs {
    padding:8px 32px; font-size:11px; color:var(--muted); letter-spacing:1px;
    display:flex; gap:6px; align-items:center;
    max-width:var(--measure); margin:0 auto; width:100%;
  }
  #crumbs span.link { cursor:pointer; text-decoration:underline dotted; }
  #crumbs span.link:hover { color:var(--ink); }
  :root { --measure: 46rem; }
  #title {
    font-family:inherit; font-size:24px; font-weight:600; color:var(--ink);
    background:transparent; border:none; outline:none; padding:6px 0 2px;
    letter-spacing:0.5px; width:100%; display:block;
  }
  #title::placeholder { color:var(--muted); }
  #conflict-bar {
    display:none; margin:6px 0; padding:6px 10px; font-size:11px; letter-spacing:0.5px;
    border:1px solid var(--red); color:var(--red); background:rgba(178,58,46,0.06);
  }
  #conflict-bar b { letter-spacing:2px; }
  .fmt-hint { color:var(--muted); font-size:11px; letter-spacing:0.5px; margin:0 0 10px; }
  .fmt-hint b { color:var(--ink); border:1px solid var(--grid); padding:0 4px; }
  #view-tabs { display:flex; width:fit-content; border:1px solid var(--ink); }
  /* floating selection toolbar */
  #sel-toolbar {
    position:fixed; z-index:30; display:none; gap:2px; padding:3px;
    background:var(--ink); border:1px solid var(--ink);
    box-shadow:2px 3px 0 rgba(27,24,22,0.25);
  }
  #sel-toolbar.show { display:flex; }
  #sel-toolbar button {
    background:var(--ink); color:var(--paper); border:none; padding:4px 8px;
    font-family:inherit; font-size:13px; cursor:pointer; line-height:1;
  }
  #sel-toolbar button:hover { background:#3a3430; }
  #sel-toolbar .ic { font-size:11px; letter-spacing:-1px; }
  /* slash command menu */
  #slash-menu {
    position:fixed; z-index:30; display:none; min-width:210px;
    background:var(--paper2); border:1px solid var(--ink);
    box-shadow:3px 3px 0 rgba(27,24,22,0.18); font-size:12px;
  }
  #slash-menu.show { display:block; }
  #slash-menu .sl-item {
    display:flex; align-items:baseline; gap:10px; padding:6px 11px; cursor:pointer;
  }
  #slash-menu .sl-item.sel, #slash-menu .sl-item:hover { background:#ece5d3; }
  #slash-menu .sl-key { color:var(--muted); font-size:10px; letter-spacing:1px; width:18px; }
  #slash-menu .sl-desc { color:var(--muted); font-size:10px; margin-left:auto; }
  #view-tabs button { border:none; border-right:1px solid var(--ink); }
  #view-tabs button:last-child { border-right:none; }
  #view-tabs button.active { background:var(--ink); color:var(--paper); }
  #work { flex:1; display:block; margin:0 22px 14px; min-height:0; overflow-y:auto; }
  #page {
    max-width:var(--measure); margin:8px auto; height:fit-content;
    padding:20px 32px 44px;
    background:rgba(246,241,229,0.85); border:1px solid var(--ink);
    box-shadow:2px 3px 0 rgba(27,24,22,0.10);
    color:var(--ink);
  }
  #blocks {
    font-family:inherit; font-size:14px; line-height:1.65; color:var(--ink);
  }
  .node-container { display:flex; gap:14px; align-items:stretch; flex:1 1 0; min-width:0; }
  .node-container[style*="row"] > * { flex:1 1 0; min-width:0; }
  .block-col {
    display:flex; align-items:flex-start; gap:4px; padding:2px 0;
    position:relative; flex:1 1 0; min-width:0;
  }
  .block-col.drop-above::before {
    content:''; position:absolute; top:0; left:20px; right:0; height:0;
    border-top:2px solid var(--red);
  }
  .block-col.drop-below::after {
    content:''; position:absolute; bottom:0; left:20px; right:0; height:0;
    border-top:2px solid var(--red);
  }
  .block-col.drop-left::before {
    content:''; position:absolute; top:2px; bottom:2px; left:-8px; width:0;
    border-left:2px solid var(--red);
  }
  .block-col.drop-right::after {
    content:''; position:absolute; top:2px; bottom:2px; right:-8px; width:0;
    border-left:2px solid var(--red);
  }
  .block-col .handle {
    color:var(--muted); cursor:grab; user-select:none; padding:6px 4px 0 0;
    font-size:13px; flex:none; letter-spacing:-2px; opacity:0;
  }
  .block-col:hover .handle { opacity:1; }
  .block-col .handle:hover { color:var(--ink); }
  .block-col.dragging { opacity:0.4; }
  .block-ed {
    flex:1; min-width:0; outline:none; border:1px solid transparent;
    font-family:inherit; font-size:14px; line-height:1.6; color:var(--ink);
    background:transparent; padding:4px 8px; min-height:30px;
    white-space:pre-wrap; overflow-wrap:break-word;
  }
  .block-ed:focus { border-color:var(--grid); background:rgba(246,241,229,0.9); }
  .block-ed:empty::before { content:attr(data-placeholder); color:var(--muted); }
  .block-ed.bl-h1 { font-size:22px; font-weight:600; letter-spacing:0.3px; line-height:1.3; }
  .block-ed.bl-h2 { font-size:18px; font-weight:600; letter-spacing:0.3px; line-height:1.3; }
  .block-ed.bl-h3 { font-size:15px; font-weight:600; letter-spacing:0.3px; line-height:1.35; }
  .block-ed code {
    background:#E6DEC9; border:1px solid var(--grid); padding:0 3px;
    font-family:inherit; font-size:13px;
  }

  .block-ed .cb-region {
    display:inline-block; width:100%; box-sizing:border-box;
    background:var(--paper2); border:1px solid var(--ink);
    font-size:13px; line-height:1.55; padding:8px 10px; margin:2px 0;
    white-space:pre-wrap;
  }
  .inline-widget { cursor:pointer; }
  .inline-widget.w-math {
    padding:0 2px; border-bottom:1px dashed var(--blue);
  }
  .inline-widget.w-math:hover, .inline-widget.w-eq:hover { background:#ece5d3; }
  .inline-widget.w-eq {
    display:block; border:1px solid var(--grid); background:var(--paper2);
    margin:3px 0; padding:5px 14px; text-align:center; overflow-x:auto;
  }
  .inline-widget.w-embed { display:block; margin:4px 0; cursor:default; }
  .inline-widget.w-img { display:inline-block; vertical-align:middle; margin:4px 6px 4px 0; }
  .kb-img {
    max-width:min(520px, 100%); max-height:360px; display:block;
    border:1px solid var(--ink); box-shadow:3px 3px 0 rgba(27,24,22,0.12);
  }
  .inline-widget .math-src { color:var(--red); font-style:italic; }
  .region-live {
    background:rgba(63,92,134,0.10); border-bottom:1px dashed var(--blue);
    font-size:13px; padding:0 2px;
  }
  .region-live.eq-live { display:inline; background:var(--paper2); box-shadow:0 0 0 1px var(--blue); }
  .block-col .b-del {
    color:var(--muted); cursor:pointer; flex:none; padding:6px 2px 0 2px;
    font-size:11px; visibility:hidden;
  }
  .block-col:hover .b-del { visibility:visible; }
  .block-col .b-del:hover { color:var(--red); }
  #blocks .add-block {
    margin:6px 0 0 24px; font-size:10px; letter-spacing:1px; color:var(--muted);
    background:transparent; border:1px dashed var(--grid);
  }
  #blocks .add-block:hover { color:var(--ink); border-color:var(--ink); }
  #preview .block-view { padding:2px 8px; }
  #preview p { margin:0 0 10px; }
  #preview h2, #preview h3, #preview h4 { margin:16px 0 8px; letter-spacing:0.5px; }
  #preview code {
    background:#E6DEC9; border:1px solid var(--grid); padding:0 4px;
    font-family:inherit; font-size:13px;
  }
  #preview .code-block { border:1px solid var(--ink); margin:0 0 12px; background:var(--paper2); }
  #preview .code-block .code-lang {
    font-size:10px; letter-spacing:2px; color:var(--muted); font-weight:600;
    padding:4px 10px 0;
  }
  #preview .code-block pre {
    margin:0; padding:8px 10px 10px; overflow-x:auto; font-family:inherit;
    font-size:13px; line-height:1.5;
  }
  #preview .eq-block {
    border:1px solid var(--grid); background:var(--paper2); margin:0 0 12px;
    padding:6px 14px; overflow-x:auto; text-align:center;
  }
  #preview .math-src { color:var(--red); font-style:italic; }
  #preview .obj-table { margin:4px 0 12px; }
  #preview table { border-collapse:collapse; font-size:13px; }
  #preview td {
    border:1px solid var(--ink); padding:4px 10px; text-align:left;
    min-width:90px; outline:none;
  }
  #preview td:focus { background:#ece5d3; }
  #preview .table-tools { display:flex; gap:6px; margin-top:4px; }
  #preview .table-tools button { font-size:10px; letter-spacing:1px; }
  .page-link {
    color:var(--blue); cursor:pointer; text-decoration:underline dotted;
    text-underline-offset:3px;
  }
  .page-link:hover { background:#ece5d3; }
  .page-link.broken { color:var(--muted); cursor:default; text-decoration:line-through; }
  #link-menu {
    position:absolute; z-index:10; background:var(--paper2); border:1px solid var(--ink);
    box-shadow:3px 3px 0 rgba(27,24,22,0.15); font-size:12px; min-width:180px;
    max-height:260px; overflow-y:auto;
  }
  #link-menu .lm-head {
    padding:5px 10px; font-size:10px; letter-spacing:2px; color:var(--muted);
    font-weight:600; border-bottom:1px solid var(--grid);
  }
  #link-menu .lm-item { padding:5px 10px; cursor:pointer; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  #link-menu .lm-item:hover { background:#ece5d3; }
  .comment-hl {
    background:transparent;
    border-bottom:1px dotted rgba(200,120,45,0.6);
    cursor:help; transition:background 0.12s ease-out;
  }
  .comment-hl.hl-active {
    background:rgba(200,120,45,0.30); border-bottom:1.5px solid var(--amber);
  }
  #comments {
    width:280px; min-width:280px; border-left:1.25px solid var(--line);
    background:rgba(246,241,229,0.92); overflow-y:auto; font-size:12px;
    display:flex; flex-direction:column;
  }
  #comments .c-head {
    padding:10px 12px; font-size:11px; letter-spacing:2px; color:var(--muted);
    font-weight:600; border-bottom:1px solid var(--line);
  }
  .cc-card { border-bottom:1px solid var(--grid); padding:9px 12px; cursor:pointer; }
  .cc-card:hover, .cc-card.active { background:#ece5d3; }
  .cc-card.active { border-left:3px solid var(--amber); padding-left:9px; }
  .cc-quote {
    color:var(--muted); font-size:11px; overflow:hidden; white-space:nowrap;
    text-overflow:ellipsis; border-left:2px solid var(--amber); padding-left:6px;
    margin-bottom:5px;
  }
  .cc-msg { padding:2px 0; line-height:1.45; cursor:text; }
  .cc-msg.editing {
    border:1px solid var(--ink); background:var(--paper2); padding:3px 6px;
    outline:none;
  }
  .cc-msg + .cc-msg { border-top:1px dotted var(--grid); margin-top:3px; padding-top:5px; }
  .cc-reply {
    width:100%; margin-top:6px; font-family:inherit; font-size:11px;
    border:1px solid var(--grid); background:var(--paper2); padding:4px 6px;
    outline:none; color:var(--ink);
  }
  .cc-reply:focus { border-color:var(--ink); }
  .cc-tools { display:flex; justify-content:flex-end; margin-top:4px; }
  .cc-resolve { color:var(--red); cursor:pointer; font-size:10px; letter-spacing:1px; }
  .cc-card.lit { background:#ece5d3; }
  #page-tools { display:flex; gap:8px; padding:0 22px 12px; }
  #page-tools .danger { color:var(--red); border-color:var(--red); }
  #no-page {
    flex:1; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:13px; letter-spacing:1px;
  }

  /* ---- status bar ---- */
  footer {
    display:flex; gap:22px; padding:7px 16px; border-top:1.25px solid var(--line);
    background:rgba(239,233,219,0.92); font-size:11px; color:var(--muted); letter-spacing:1px;
  }
  footer b { color:var(--ink); font-weight:500; }
  #sync-dot { color:var(--green); }
  #toast {
    position:fixed; left:50%; bottom:52px; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:0.5px;
    padding:8px 16px; border:1px solid var(--ink); z-index:40; max-width:80vw;
    opacity:0; pointer-events:none; transition:opacity 0.2s ease-out;
  }
  #toast.show { opacity:1; }
  #toast.err { background:var(--red); border-color:var(--red); }
</style>
</head>
<body>
  <header>
    <div class="h-left">
      <button id="nav-toggle" title="pages">☰</button>
      <div class="brand">HASHWEB</div>
    </div>
    <div class="h-right">
      <div class="fig">FIG. 03 — KNOWLEDGE BASE ON A FLAT STORE OF OBJECTS</div>
      <button id="comments-toggle" title="comments">💬 <span id="ct-count">0</span></button>
    </div>
  </header>
  <div id="panel-backdrop"></div>
  <div id="toast"></div>
  <main>
    <nav id="sidebar">
      <div class="side-head"><span>PAGES</span><button id="new-page">+ NEW</button></div>
      <div id="tree"></div>
    </nav>
    <section id="editor-pane">
      <div id="crumbs"></div>
      <input id="image-file" type="file" accept="image/*" style="display:none">
      <div id="sel-toolbar">
        <button data-act="code" title="inline code (⌘E)"><span class="ic">&lt;/&gt;</span></button>
        <button data-act="math" title="inline math">∑</button>
        <button data-act="comment" title="comment on selection">💬</button>
        <button data-act="clear" title="clear formatting">⌫</button>
      </div>
      <div id="slash-menu"></div>
      <div id="work">
        <div id="page">
          <input id="title" placeholder="Untitled" spellcheck="false" autocomplete="off">
          <div id="conflict-bar"></div>
          <div class="fmt-hint">Select text to format · type <b>/</b> for blocks</div>
          <div id="blocks"></div>
        </div>
      </div>
      <div id="page-tools">
        <button id="new-subpage">+ SUBPAGE</button>
        <button id="delete-page" class="danger">DELETE PAGE</button>
      </div>
      <div id="no-page" style="display:none">no page selected — create one</div>
    </section>
    <aside id="comments" style="display:none"></aside>
  </main>
  <footer>
    <span>OBJECTS <b id="stat-objects">0</b></span>
    <span>SNAPSHOT <b id="stat-bytes">0 B</b></span>
    <span>PARKED <b id="stat-parked">0</b></span>
    <span id="sync-dot">● LIVE — open this page in a second tab to watch merge</span>
  </footer>
  <script type="module" src="./kb.js"></script>
</body>
</html>
