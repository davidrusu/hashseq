<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HashWeb — Knowledge Base</title>
<style>
  @font-face { font-family:'PM'; font-weight:400; src:url('./fonts/ibm-plex-mono-400.woff2') format('woff2'); }
  @font-face { font-family:'PM'; font-weight:500; src:url('./fonts/ibm-plex-mono-500.woff2') format('woff2'); }
  @font-face { font-family:'PM'; font-weight:600; src:url('./fonts/ibm-plex-mono-600.woff2') format('woff2'); }

  :root {
    /* FIELD — sepia berkeley (default) */
    --paper:#EFE9DB; --paper2:#F6F1E5; --ink:#1B1816; --muted:#7C7361;
    --red:#B23A2E; --green:#2F5D43; --amber:#C8782D; --grid:#D2C8B2; --line:#1B1816;
    --blue:#3F5C86;
    --hover:#ece5d3; --code-bg:#E6DEC9;
    --card:rgba(246,241,229,0.85); --panel:rgba(246,241,229,0.92); --chrome:rgba(239,233,219,0.9);
    --focus-bg:rgba(246,241,229,0.9); --backdrop:rgba(27,24,22,0.25); --dot:var(--grid);
    --tb-bg:#1B1816; --tb-fg:#EFE9DB; --tb-hover:#3a3430;
    --c-underline:rgba(200,120,45,0.6); --c-active:rgba(200,120,45,0.30);
    --math-live:rgba(63,92,134,0.10); --danger-soft:rgba(178,58,46,0.06);
    --shadow-card:2px 3px 0 rgba(27,24,22,0.10);
    --shadow-menu:3px 3px 0 rgba(27,24,22,0.18);
    --shadow-pop:2px 3px 0 rgba(27,24,22,0.25);
    --shadow-img:3px 3px 0 rgba(27,24,22,0.12);
    --shadow-panel:-4px 0 14px rgba(27,24,22,0.25);
    --shadow-panel-r:4px 0 14px rgba(27,24,22,0.25);
    --font:'PM','IBM Plex Mono',monospace; --mono:'PM','IBM Plex Mono',monospace;
    --radius:0px;
  }
  /* GALLERY — clean white, soft sans, quiet chrome */
  body[data-theme="gallery"] {
    --paper:#FBFBFA; --paper2:#FFFFFF; --ink:#26251F; --muted:#9E9C94;
    --red:#D4483A; --green:#2E9E6B; --amber:#DE9B2D; --grid:#ECEBE6; --line:#E0DED7;
    --blue:#2E66D0;
    --hover:#F2F1EC; --code-bg:#F4F3EF;
    --card:#FFFFFF; --panel:#FBFBFA; --chrome:rgba(251,251,250,0.92);
    --focus-bg:#FFFFFF; --backdrop:rgba(30,30,25,0.25); --dot:transparent;
    --tb-bg:#26251F; --tb-fg:#FBFBFA; --tb-hover:#484538;
    --c-underline:rgba(222,155,45,0.65); --c-active:rgba(222,155,45,0.25);
    --math-live:rgba(46,102,208,0.08); --danger-soft:rgba(212,72,58,0.05);
    --shadow-card:0 1px 2px rgba(25,25,20,0.06), 0 6px 24px rgba(25,25,20,0.07);
    --shadow-menu:0 4px 18px rgba(25,25,20,0.14);
    --shadow-pop:0 3px 12px rgba(25,25,20,0.18);
    --shadow-img:0 2px 10px rgba(25,25,20,0.12);
    --shadow-panel:-4px 0 18px rgba(25,25,20,0.12);
    --shadow-panel-r:4px 0 18px rgba(25,25,20,0.12);
    --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
    --radius:7px;
  }
  /* TERMINAL — dark phosphor */
  body[data-theme="terminal"] {
    --paper:#0C100C; --paper2:#131813; --ink:#CBE6C3; --muted:#5F7A5F;
    --red:#E5484D; --green:#4CD97B; --amber:#E0B25C; --grid:#1B241B; --line:#2F412F;
    --blue:#6CB6FF;
    --hover:#1B241B; --code-bg:#172017;
    --card:#101510; --panel:#0A0E0A; --chrome:rgba(10,14,10,0.9);
    --focus-bg:#131813; --backdrop:rgba(0,0,0,0.55); --dot:#1B241B;
    --tb-bg:#CBE6C3; --tb-fg:#0C100C; --tb-hover:#a9c9a0;
    --c-underline:rgba(224,178,92,0.55); --c-active:rgba(224,178,92,0.20);
    --math-live:rgba(108,182,255,0.12); --danger-soft:rgba(229,72,77,0.10);
    --shadow-card:3px 3px 0 rgba(0,0,0,0.55);
    --shadow-menu:3px 3px 0 rgba(0,0,0,0.55);
    --shadow-pop:2px 3px 0 rgba(0,0,0,0.55);
    --shadow-img:3px 3px 0 rgba(0,0,0,0.55);
    --shadow-panel:-4px 0 14px rgba(0,0,0,0.6);
    --shadow-panel-r:4px 0 14px rgba(0,0,0,0.6);
  }
  /* NORD — arctic blue-grey */
  body[data-theme="nord"] {
    --paper:#2E3440; --paper2:#3B4252; --ink:#E5E9F0; --muted:#8894AA;
    --red:#BF616A; --green:#A3BE8C; --amber:#EBCB8B; --grid:#394050; --line:#4C566A;
    --blue:#88C0D0;
    --hover:#434C5E; --code-bg:#434C5E;
    --card:#353C4A; --panel:#2A303C; --chrome:rgba(42,48,60,0.92);
    --focus-bg:#3B4252; --backdrop:rgba(0,0,0,0.45); --dot:#394050;
    --tb-bg:#E5E9F0; --tb-fg:#2E3440; --tb-hover:#cbd3e1;
    --c-underline:rgba(235,203,139,0.55); --c-active:rgba(235,203,139,0.20);
    --math-live:rgba(136,192,208,0.14); --danger-soft:rgba(191,97,106,0.12);
    --shadow-card:0 2px 10px rgba(0,0,0,0.30);
    --shadow-menu:0 4px 16px rgba(0,0,0,0.40);
    --shadow-pop:0 3px 12px rgba(0,0,0,0.40);
    --shadow-img:0 2px 10px rgba(0,0,0,0.35);
    --shadow-panel:-4px 0 16px rgba(0,0,0,0.45);
    --shadow-panel-r:4px 0 16px rgba(0,0,0,0.45);
    --radius:4px;
  }
  /* EDITORIAL — serif magazine, no card, big display title */
  body[data-theme="editorial"] {
    --paper:#F7F5EF; --paper2:#FFFFFF; --ink:#1C1B18; --muted:#8D8779;
    --red:#C42B1E; --green:#2F6B4F; --amber:#B8860B; --grid:#E4E0D4; --line:#C9C4B6;
    --blue:#1F4FA0;
    --hover:#EDEAE0; --code-bg:#EDEAE0;
    --card:transparent; --panel:transparent; --chrome:rgba(247,245,239,0.95);
    --focus-bg:#FFFFFF; --backdrop:rgba(28,27,24,0.25); --dot:transparent;
    --tb-bg:#1C1B18; --tb-fg:#F7F5EF; --tb-hover:#45423a;
    --c-underline:rgba(184,134,11,0.6); --c-active:rgba(184,134,11,0.25);
    --math-live:rgba(31,79,160,0.08); --danger-soft:rgba(196,43,30,0.05);
    --shadow-card:none;
    --shadow-menu:0 3px 14px rgba(28,27,24,0.15);
    --shadow-pop:0 3px 10px rgba(28,27,24,0.2);
    --shadow-img:0 2px 10px rgba(28,27,24,0.15);
    --shadow-panel:-4px 0 16px rgba(28,27,24,0.12);
    --shadow-panel-r:4px 0 16px rgba(28,27,24,0.12);
    --font:'Charter','Iowan Old Style',Georgia,'Times New Roman',serif;
    --radius:0px;
  }
  /* POSTER — neo-brutalist: blocks as cards, thick borders, hard shadows */
  body[data-theme="poster"] {
    --paper:#F7F1E3; --paper2:#FFFFFF; --ink:#141414; --muted:#6E6759;
    --red:#E8442E; --green:#0F8A5F; --amber:#FFD43B; --grid:#E6DECB; --line:#141414;
    --blue:#2B6EF2;
    --hover:#FFE9A8; --code-bg:#FFF3C4;
    --card:#FFFFFF; --panel:#F7F1E3; --chrome:#F7F1E3;
    --focus-bg:#FFFDF5; --backdrop:rgba(20,20,20,0.3); --dot:#E6DECB;
    --tb-bg:#141414; --tb-fg:#FFD43B; --tb-hover:#3a3a3a;
    --c-underline:rgba(232,68,46,0.6); --c-active:rgba(255,212,59,0.5);
    --math-live:rgba(43,110,242,0.1); --danger-soft:rgba(232,68,46,0.07);
    --shadow-card:6px 6px 0 #141414;
    --shadow-menu:5px 5px 0 #141414;
    --shadow-pop:4px 4px 0 #141414;
    --shadow-img:5px 5px 0 #141414;
    --shadow-panel:-6px 0 0 #141414;
    --shadow-panel-r:6px 0 0 #141414;
    --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --radius:8px;
  }
  /* ZEN — chrome disappears, narrow centered measure, tall leading */
  body[data-theme="zen"] {
    --paper:#F5F5F2; --paper2:#EDEDE9; --ink:#43423D; --muted:#B3B2AA;
    --red:#B0674F; --green:#6E8B74; --amber:#C2A36B; --grid:#E6E6E1; --line:#DDDDD7;
    --blue:#7C9AA6;
    --hover:#ECECE7; --code-bg:#ECECE7;
    --card:transparent; --panel:transparent; --chrome:transparent;
    --focus-bg:rgba(255,255,255,0.6); --backdrop:rgba(67,66,61,0.2); --dot:transparent;
    --tb-bg:#43423D; --tb-fg:#F5F5F2; --tb-hover:#5c5b54;
    --c-underline:rgba(194,163,107,0.5); --c-active:rgba(194,163,107,0.22);
    --math-live:rgba(124,154,166,0.12); --danger-soft:rgba(176,103,79,0.06);
    --shadow-card:none;
    --shadow-menu:0 4px 16px rgba(67,66,61,0.12);
    --shadow-pop:0 3px 10px rgba(67,66,61,0.15);
    --shadow-img:0 1px 8px rgba(67,66,61,0.12);
    --shadow-panel:-4px 0 14px rgba(67,66,61,0.1);
    --shadow-panel-r:4px 0 14px rgba(67,66,61,0.1);
    --radius:2px;
  }
  /* FABLE — twilight manuscript: serif prose, mono structure, candlelight on indigo */
  body[data-theme="fable"] {
    --paper:#191722; --paper2:#221F2E; --ink:#E8E0D0; --muted:#8B8497;
    --red:#D97A6C; --green:#9BB98A; --amber:#D9A84E; --grid:#2A2740; --line:#3A3450;
    --blue:#8F9FE8;
    --hover:#2A2638; --code-bg:#2A2638;
    --card:#1E1B28; --panel:#15131D; --chrome:rgba(21,19,29,0.9);
    --focus-bg:#242030; --backdrop:rgba(10,9,15,0.55); --dot:#2A2740;
    --tb-bg:#D9A84E; --tb-fg:#191722; --tb-hover:#c5943c;
    --c-underline:rgba(217,168,78,0.5); --c-active:rgba(217,168,78,0.24);
    --math-live:rgba(143,159,232,0.12); --danger-soft:rgba(217,122,108,0.08);
    --shadow-card:0 0 0 1px rgba(217,168,78,0.12), 0 10px 34px rgba(0,0,0,0.5);
    --shadow-menu:0 6px 22px rgba(0,0,0,0.55);
    --shadow-pop:0 4px 14px rgba(0,0,0,0.55);
    --shadow-img:0 4px 18px rgba(0,0,0,0.5);
    --shadow-panel:-6px 0 20px rgba(0,0,0,0.55);
    --shadow-panel-r:6px 0 20px rgba(0,0,0,0.55);
    --font:'Charter','Iowan Old Style',Georgia,'Times New Roman',serif;
    --radius:3px;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    font-family:var(--font); color:var(--ink); background:var(--paper);
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
    background-image:radial-gradient(var(--dot) 0.7px, transparent 0.7px);
    background-size:22px 22px;
  }
  header {
    display:flex; align-items:baseline; justify-content:space-between;
    padding:10px 16px; border-bottom:1.25px solid var(--line); background:var(--chrome);
  }
  header .brand { font-weight:600; letter-spacing:3px; font-size:12px; }
  header .fig { color:var(--muted); font-size:11px; letter-spacing:1px; }
  header .h-left, header .h-right { display:flex; align-items:center; gap:12px; }
  #nav-toggle, #comments-toggle { font-size:13px; padding:3px 8px; }
  body.collapse-nav #sidebar { display:none; }
  #panel-backdrop {
    display:none; position:fixed; inset:0; z-index:15;
    background:var(--backdrop);
  }

  /* ---- responsive: panels collapse into slide-in overlays ---- */
  @media (max-width: 1150px) {
    #comments {
      position:fixed; top:0; right:0; bottom:0; z-index:20;
      transform:translateX(100%); transition:transform 0.18s ease-out;
      box-shadow:var(--shadow-panel);
    }
    body.show-comments #comments { transform:none; background:var(--paper2); }
    body.show-comments #panel-backdrop { display:block; }
  }
  @media (max-width: 900px) {
    body.collapse-nav #sidebar { display:flex; } /* overlay mode overrides collapse */
    #sidebar {
      position:fixed; top:0; left:0; bottom:0; z-index:20;
      transform:translateX(-100%); transition:transform 0.18s ease-out;
      box-shadow:var(--shadow-panel-r);
    }
    body.show-nav #sidebar { transform:none; background:var(--paper2); }
    body.show-nav #panel-backdrop, body.show-comments #panel-backdrop { display:block; }
    header .fig { display:none; }
    #crumbs, #title { padding-left:14px; }
    #fmt-row, #work { margin-left:12px; margin-right:12px; }
    #page-tools { padding-left:12px; }
  }
  @media (max-width: 640px) {
    #fmt-tools { flex-wrap:wrap; }
    .fig { display:none; }
  }

  main { flex:1; display:flex; min-height:0; }

  /* ---- sidebar ---- */
  #sidebar {
    width:280px; min-width:280px; border-right:1.25px solid var(--line);
    background:var(--panel); display:flex; flex-direction:column;
  }
  #sidebar .side-head {
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 12px; border-bottom:1px solid var(--line);
    font-size:11px; letter-spacing:2px; color:var(--muted); font-weight:600;
  }
  button {
    font-family:inherit; font-size:11px; color:var(--ink); background:var(--paper2);
    border:1px solid var(--line); padding:3px 9px; cursor:pointer; letter-spacing:0.5px;
  }
  button:hover { background:var(--hover); }
  #tree { flex:1; overflow-y:auto; padding:6px 0; font-size:13px; }
  .page-row {
    display:flex; align-items:center; gap:6px; padding:4px 12px; cursor:pointer;
    border-left:3px solid transparent; user-select:none;
  }
  .page-row:hover { background:var(--hover); }
  .page-row.active { border-left-color:var(--red); background:var(--hover); font-weight:600; }
  .page-row .twirl { color:var(--muted); width:12px; text-align:center; flex:none; }
  .page-row .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .page-row .sub { color:var(--muted); font-size:10px; }
  .page-row.drop-above::before {
    content:''; position:absolute; top:0; left:12px; right:0; height:0;
    border-top:2px solid var(--red);
  }
  .page-row.drop-below::after {
    content:''; position:absolute; bottom:0; left:12px; right:0; height:0;
    border-top:2px solid var(--red);
  }
  .page-row { position:relative; }
  .page-row .twirl { cursor:grab; }
  .page-row.dragging { opacity:0.4; }
  .page-row.drop-into { box-shadow:inset 0 0 0 2px var(--red); background:var(--hover); }
  .empty-note { color:var(--muted); font-size:12px; padding:14px; letter-spacing:0.5px; }
  .orphan-note {
    margin-top:14px; padding:6px 12px; font-size:10px; letter-spacing:2px;
    color:var(--amber); font-weight:600; border-top:1px dashed var(--amber);
  }
  .page-row.orphan { opacity:0.75; }
  .page-row.orphan .name { text-decoration:underline dashed; text-underline-offset:3px; }

  /* ---- editor ---- */
  #editor-pane { flex:1; display:flex; flex-direction:column; min-width:0; }
  #crumbs {
    padding:8px 32px; font-size:11px; color:var(--muted); letter-spacing:1px;
    display:flex; gap:6px; align-items:center;
    max-width:var(--measure); margin:0 auto; width:100%;
  }
  #crumbs span.link { cursor:pointer; text-decoration:underline dotted; }
  #crumbs span.link:hover { color:var(--ink); }
  :root { --measure: 46rem; }
  #title {
    font-family:inherit; font-size:24px; font-weight:600; color:var(--ink);
    background:transparent; border:none; outline:none; padding:6px 0 2px;
    letter-spacing:0.5px; width:100%; display:block;
  }
  #title::placeholder { color:var(--muted); }
  #conflict-bar {
    display:none; margin:6px 0; padding:6px 10px; font-size:11px; letter-spacing:0.5px;
    border:1px solid var(--red); color:var(--red); background:var(--danger-soft);
  }
  #conflict-bar b { letter-spacing:2px; }
  .fmt-hint { color:var(--muted); font-size:11px; letter-spacing:0.5px; margin:0 0 10px; }
  .fmt-hint b { color:var(--ink); border:1px solid var(--grid); padding:0 4px; }
  #view-tabs { display:flex; width:fit-content; border:1px solid var(--line); }
  /* floating selection toolbar */
  #sel-toolbar {
    position:fixed; z-index:30; display:none; gap:2px; padding:3px;
    background:var(--tb-bg); border:1px solid var(--tb-bg);
    box-shadow:var(--shadow-pop);
  }
  #sel-toolbar.show { display:flex; }
  #sel-toolbar button {
    background:var(--tb-bg); color:var(--tb-fg); border:none; padding:4px 8px;
    font-family:inherit; font-size:13px; cursor:pointer; line-height:1;
  }
  #sel-toolbar button:hover { background:var(--tb-hover); }
  #sel-toolbar .ic { font-size:11px; letter-spacing:-1px; }
  /* slash command menu */
  #slash-menu {
    position:fixed; z-index:30; display:none; min-width:210px;
    background:var(--paper2); border:1px solid var(--line);
    box-shadow:var(--shadow-menu); font-size:12px;
  }
  #slash-menu.show { display:block; }
  #slash-menu .sl-item {
    display:flex; align-items:baseline; gap:10px; padding:6px 11px; cursor:pointer;
  }
  #slash-menu .sl-item.sel, #slash-menu .sl-item:hover { background:var(--hover); }
  #slash-menu .sl-key { color:var(--muted); font-size:10px; letter-spacing:1px; width:18px; }
  #slash-menu .sl-desc { color:var(--muted); font-size:10px; margin-left:auto; }
  #view-tabs button { border:none; border-right:1px solid var(--line); }
  #view-tabs button:last-child { border-right:none; }
  #view-tabs button.active { background:var(--tb-bg); color:var(--tb-fg); }
  #work { flex:1; display:block; margin:0 22px 14px; min-height:0; overflow-y:auto; }
  #page {
    max-width:var(--measure); margin:8px auto; height:fit-content;
    padding:20px 32px 44px;
    background:var(--card); border:1px solid var(--line);
    box-shadow:var(--shadow-card);
    color:var(--ink);
  }
  #blocks {
    font-family:inherit; font-size:14px; line-height:1.65; color:var(--ink);
  }
  .node-container { display:flex; gap:14px; align-items:stretch; flex:1 1 0; min-width:0; }
  .node-container[style*="row"] > * { flex:1 1 0; min-width:0; }
  .block-col {
    display:flex; align-items:flex-start; gap:4px; padding:2px 0;
    position:relative; flex:1 1 0; min-width:0;
  }
  .block-col.drop-above::before {
    content:''; position:absolute; top:0; left:20px; right:0; height:0;
    border-top:2px solid var(--red);
  }
  .block-col.drop-below::after {
    content:''; position:absolute; bottom:0; left:20px; right:0; height:0;
    border-top:2px solid var(--red);
  }
  .block-col.drop-left::before {
    content:''; position:absolute; top:2px; bottom:2px; left:-8px; width:0;
    border-left:2px solid var(--red);
  }
  .block-col.drop-right::after {
    content:''; position:absolute; top:2px; bottom:2px; right:-8px; width:0;
    border-left:2px solid var(--red);
  }
  .block-col .handle {
    color:var(--muted); cursor:grab; user-select:none; padding:6px 4px 0 0;
    font-size:13px; flex:none; letter-spacing:-2px; opacity:0;
  }
  .block-col:hover .handle { opacity:1; }
  .block-col .handle:hover { color:var(--ink); }
  .block-col.dragging { opacity:0.4; }
  .block-col.pl-conflict { outline:1.5px dashed var(--amber); outline-offset:2px; }
  .block-ed {
    flex:1; min-width:0; outline:none; border:1px solid transparent;
    font-family:inherit; font-size:14px; line-height:1.6; color:var(--ink);
    background:transparent; padding:4px 8px; min-height:30px;
    white-space:pre-wrap; overflow-wrap:break-word;
  }
  .block-ed:focus { border-color:var(--grid); background:var(--focus-bg); }
  .block-ed:empty::before { content:attr(data-placeholder); color:var(--muted); }
  .block-ed.bl-h1 { font-size:22px; font-weight:600; letter-spacing:0.3px; line-height:1.3; }
  .block-ed.bl-h2 { font-size:18px; font-weight:600; letter-spacing:0.3px; line-height:1.3; }
  .block-ed.bl-h3 { font-size:15px; font-weight:600; letter-spacing:0.3px; line-height:1.35; }
  .block-ed.bl-bullet, .block-ed.bl-number { padding-left:28px; position:relative; }
  .block-ed.bl-bullet::before {
    content:'\2022'; position:absolute; left:12px; color:var(--muted);
  }
  /* Numbering is pure projection, computed by renumberLists() at render
     time (Chrome's sibling counter-reset shadowing is unreliable). */
  .block-ed.bl-number::before {
    content:attr(data-num) '.';
    position:absolute; left:8px; color:var(--muted); font-size:0.85em;
  }
  .block-ed code {
    background:var(--code-bg); border:1px solid var(--grid); padding:0 3px;
    font-family:inherit; font-size:13px;
  }

  .block-ed .cb-region {
    display:inline-block; width:100%; box-sizing:border-box;
    background:var(--paper2); border:1px solid var(--line);
    font-size:13px; line-height:1.55; padding:8px 10px; margin:2px 0;
    white-space:pre-wrap;
  }
  .inline-widget { cursor:pointer; }
  .inline-widget.w-math {
    padding:0 2px; border-bottom:1px dashed var(--blue);
  }
  .inline-widget.w-math:hover, .inline-widget.w-eq:hover { background:var(--hover); }
  .inline-widget.w-eq {
    display:block; border:1px solid var(--grid); background:var(--paper2);
    margin:3px 0; padding:5px 14px; text-align:center; overflow-x:auto;
  }
  .inline-widget.w-embed { display:block; margin:4px 0; cursor:default; }
  .inline-widget.w-img { display:inline-block; vertical-align:middle; margin:4px 6px 4px 0; }
  .kb-img {
    max-width:min(520px, 100%); max-height:360px; display:block;
    border:1px solid var(--line); box-shadow:var(--shadow-img);
  }
  .inline-widget .math-src { color:var(--red); font-style:italic; }
  .region-live {
    background:var(--math-live); border-bottom:1px dashed var(--blue);
    font-size:13px; padding:0 2px;
  }
  .region-live.eq-live { display:inline; background:var(--paper2); box-shadow:0 0 0 1px var(--blue); }
  .block-col .b-del {
    color:var(--muted); cursor:pointer; flex:none; padding:6px 2px 0 2px;
    font-size:11px; visibility:hidden;
  }
  .block-col:hover .b-del { visibility:visible; }
  .block-col .b-del:hover { color:var(--red); }
  #blocks .add-block {
    margin:6px 0 0 24px; font-size:10px; letter-spacing:1px; color:var(--muted);
    background:transparent; border:1px dashed var(--grid);
  }
  #blocks .add-block:hover { color:var(--ink); border-color:var(--ink); }
  #preview .block-view { padding:2px 8px; }
  #preview p { margin:0 0 10px; }
  #preview h2, #preview h3, #preview h4 { margin:16px 0 8px; letter-spacing:0.5px; }
  #preview code {
    background:var(--code-bg); border:1px solid var(--grid); padding:0 4px;
    font-family:inherit; font-size:13px;
  }
  #preview .code-block { border:1px solid var(--line); margin:0 0 12px; background:var(--paper2); }
  #preview .code-block .code-lang {
    font-size:10px; letter-spacing:2px; color:var(--muted); font-weight:600;
    padding:4px 10px 0;
  }
  #preview .code-block pre {
    margin:0; padding:8px 10px 10px; overflow-x:auto; font-family:inherit;
    font-size:13px; line-height:1.5;
  }
  #preview .eq-block {
    border:1px solid var(--grid); background:var(--paper2); margin:0 0 12px;
    padding:6px 14px; overflow-x:auto; text-align:center;
  }
  #preview .math-src { color:var(--red); font-style:italic; }
  #preview .obj-table { margin:4px 0 12px; }
  #preview table { border-collapse:collapse; font-size:13px; }
  #preview td {
    border:1px solid var(--line); padding:4px 10px; text-align:left;
    min-width:90px; outline:none;
  }
  #preview td:focus { background:var(--hover); }
  #preview .table-tools { display:flex; gap:6px; margin-top:4px; }
  #preview .table-tools button { font-size:10px; letter-spacing:1px; }
  .page-link {
    color:var(--blue); cursor:pointer; text-decoration:underline dotted;
    text-underline-offset:3px;
  }
  .page-link:hover { background:var(--hover); }
  .page-link.broken { color:var(--muted); cursor:default; text-decoration:line-through; }
  .pending-embed {
    display:inline-block; padding:2px 10px; font-size:11px; letter-spacing:0.5px;
    color:var(--muted); border:1px dashed var(--grid); border-radius:var(--radius);
    background:var(--paper2);
  }
  #link-menu {
    position:absolute; z-index:10; background:var(--paper2); border:1px solid var(--line);
    box-shadow:var(--shadow-menu); font-size:12px; min-width:180px;
    max-height:260px; overflow-y:auto;
  }
  #link-menu .lm-head {
    padding:5px 10px; font-size:10px; letter-spacing:2px; color:var(--muted);
    font-weight:600; border-bottom:1px solid var(--grid);
  }
  #link-menu .lm-item { padding:5px 10px; cursor:pointer; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  #link-menu .lm-item:hover { background:var(--hover); }
  .comment-hl {
    background:transparent;
    border-bottom:1px dotted var(--c-underline);
    cursor:help; transition:background 0.12s ease-out;
  }
  .comment-hl.hl-active {
    background:var(--c-active); border-bottom:1.5px solid var(--amber);
  }
  #comments {
    width:280px; min-width:280px; border-left:1.25px solid var(--line);
    background:var(--panel); overflow-y:auto; font-size:12px;
    display:flex; flex-direction:column;
  }
  #comments .c-head {
    padding:10px 12px; font-size:11px; letter-spacing:2px; color:var(--muted);
    font-weight:600; border-bottom:1px solid var(--line);
  }
  .cc-card { border-bottom:1px solid var(--grid); padding:9px 12px; cursor:pointer; }
  .cc-card:hover, .cc-card.active { background:var(--hover); }
  .cc-card.active { border-left:3px solid var(--amber); padding-left:9px; }
  .cc-quote {
    color:var(--muted); font-size:11px; overflow:hidden; white-space:nowrap;
    text-overflow:ellipsis; border-left:2px solid var(--amber); padding-left:6px;
    margin-bottom:5px;
  }
  .cc-msg { padding:2px 0; line-height:1.45; cursor:text; }
  .cc-msg.editing {
    border:1px solid var(--line); background:var(--paper2); padding:3px 6px;
    outline:none;
  }
  .cc-msg + .cc-msg { border-top:1px dotted var(--grid); margin-top:3px; padding-top:5px; }
  .cc-reply {
    width:100%; margin-top:6px; font-family:inherit; font-size:11px;
    border:1px solid var(--grid); background:var(--paper2); padding:4px 6px;
    outline:none; color:var(--ink);
  }
  .cc-reply:focus { border-color:var(--ink); }
  .cc-tools { display:flex; justify-content:flex-end; margin-top:4px; }
  .cc-resolve { color:var(--red); cursor:pointer; font-size:10px; letter-spacing:1px; }
  .cc-card.lit { background:var(--hover); }
  #page-tools { display:flex; gap:8px; padding:0 22px 12px; }
  #page-tools .danger { color:var(--red); border-color:var(--red); }
  #no-page {
    flex:1; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:13px; letter-spacing:1px;
  }

  /* ---- status bar ---- */
  footer {
    display:flex; gap:22px; padding:7px 16px; border-top:1.25px solid var(--line);
    background:var(--chrome); font-size:11px; color:var(--muted); letter-spacing:1px;
  }
  footer b { color:var(--ink); font-weight:500; }
  #sync-dot { color:var(--green); }
  #toast {
    position:fixed; left:50%; bottom:52px; transform:translateX(-50%);
    background:var(--tb-bg); color:var(--tb-fg); font-size:12px; letter-spacing:0.5px;
    padding:8px 16px; border:1px solid var(--tb-bg); z-index:40; max-width:80vw;
    opacity:0; pointer-events:none; transition:opacity 0.2s ease-out;
  }
  #toast.show { opacity:1; }
  #toast.err { background:var(--red); border-color:var(--red); }
  /* ---- theme plumbing ---- */
  .block-ed code, #preview code, #preview pre, .cb-region, .region-live, .math-src,
  #stat-objects, #stat-bytes, #stat-parked { font-family:var(--mono); }
  button, #page, #sel-toolbar, #slash-menu, #link-menu, #toast, .kb-img, .block-ed,
  .block-ed code, .cb-region, .inline-widget.w-eq, .cc-reply, .cc-msg.editing { border-radius:var(--radius); }
  body[data-theme="gallery"] .block-ed { font-size:15px; }
  body[data-theme="gallery"] #title { font-size:27px; letter-spacing:0; }
  body[data-theme="gallery"] #page { border-color:transparent; }
  /* ---- theme structure: EDITORIAL ---- */
  body[data-theme="editorial"] #page { border:none; box-shadow:none; max-width:52rem; padding-top:36px; }
  body[data-theme="editorial"] #title {
    font-size:42px; font-weight:700; letter-spacing:-0.5px;
    border-bottom:3px solid var(--ink); padding-bottom:12px; margin-bottom:8px;
  }
  body[data-theme="editorial"] .block-ed { font-size:17px; line-height:1.8; }
  body[data-theme="editorial"] .block-ed.bl-h1 { font-size:28px; }
  body[data-theme="editorial"] .block-ed.bl-h2 { font-size:22px; }
  body[data-theme="editorial"] header { border-bottom:1px solid var(--ink); }
  body[data-theme="editorial"] .fmt-hint { display:none; }

  /* ---- theme structure: POSTER ---- */
  body[data-theme="poster"] header { border-bottom:3px solid var(--ink); }
  body[data-theme="poster"] header .brand {
    background:var(--amber); border:2px solid var(--ink); padding:3px 10px; letter-spacing:4px;
  }
  body[data-theme="poster"] footer { border-top:3px solid var(--ink); }
  body[data-theme="poster"] #sidebar { border-right:3px solid var(--ink); }
  body[data-theme="poster"] #comments { border-left:3px solid var(--ink); }
  body[data-theme="poster"] button { border:2px solid var(--ink); box-shadow:3px 3px 0 var(--ink); font-weight:700; }
  body[data-theme="poster"] button:hover { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  body[data-theme="poster"] #sel-toolbar button { border:none; box-shadow:none; }
  body[data-theme="poster"] #sel-toolbar button:hover { transform:none; }
  body[data-theme="poster"] #page { border:3px solid var(--ink); }
  body[data-theme="poster"] #title { font-size:38px; font-weight:800; text-transform:uppercase; letter-spacing:1.5px; }
  body[data-theme="poster"] #blocks > .block-col, body[data-theme="poster"] #blocks > .node-container .block-col {
    background:var(--paper2); border:2px solid var(--ink); box-shadow:4px 4px 0 var(--ink);
    border-radius:var(--radius); padding:4px 10px;
  }
  body[data-theme="poster"] #blocks > .block-col { margin:12px 0; }
  body[data-theme="poster"] .page-row.active { background:var(--amber); }

  /* ---- theme structure: ZEN ---- */
  body[data-theme="zen"] header, body[data-theme="zen"] footer {
    border-color:transparent; opacity:0.3; transition:opacity 0.25s ease-out;
  }
  body[data-theme="zen"] header:hover, body[data-theme="zen"] footer:hover { opacity:1; }
  body[data-theme="zen"] #sidebar {
    border-color:transparent; opacity:0.35; transition:opacity 0.25s ease-out;
    width:230px; min-width:230px;
  }
  body[data-theme="zen"] #sidebar:hover { opacity:1; }
  body[data-theme="zen"] #comments { border-color:transparent; opacity:0.5; transition:opacity 0.25s ease-out; }
  body[data-theme="zen"] #comments:hover { opacity:1; }
  body[data-theme="zen"] #page { border:none; box-shadow:none; max-width:40rem; padding-top:48px; }
  body[data-theme="zen"] #title { font-size:19px; font-weight:600; text-align:center; letter-spacing:2px; }
  body[data-theme="zen"] #crumbs { opacity:0.45; }
  body[data-theme="zen"] .fmt-hint { display:none; }
  body[data-theme="zen"] .block-ed { line-height:1.95; }

  /* ---- theme structure: FABLE ---- */
  body[data-theme="fable"] {
    background-image:
      radial-gradient(1100px 500px at 50% -8%, rgba(143,159,232,0.07), transparent 70%),
      radial-gradient(var(--dot) 0.7px, transparent 0.7px);
    background-size:100% 100%, 22px 22px;
  }
  body[data-theme="fable"] header .brand { color:var(--amber); letter-spacing:4px; }
  body[data-theme="fable"] #page { padding-top:30px; position:relative; }
  body[data-theme="fable"] #page::after {
    content:'\2042'; display:block; text-align:center; margin-top:36px;
    color:var(--amber); opacity:0.65; font-size:15px; letter-spacing:6px;
  }
  body[data-theme="fable"] #title {
    font-size:32px; font-weight:600; font-style:italic; letter-spacing:0.5px;
    border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:8px;
  }
  body[data-theme="fable"] .block-ed { font-size:16px; line-height:1.85; }
  body[data-theme="fable"] .block-ed.bl-h1, body[data-theme="fable"] .block-ed.bl-h2,
  body[data-theme="fable"] .block-ed.bl-h3 {
    font-family:var(--mono); text-transform:uppercase; color:var(--amber);
    letter-spacing:3px; line-height:1.6;
  }
  body[data-theme="fable"] .block-ed.bl-h1 { font-size:16px; }
  body[data-theme="fable"] .block-ed.bl-h2 { font-size:14px; }
  body[data-theme="fable"] .block-ed.bl-h3 { font-size:12.5px; }
  body[data-theme="fable"] .page-row.active { border-left-color:var(--amber); }
  body[data-theme="fable"] .fmt-hint { display:none; }
</style>
</head>
<body>
  <script>
    try {
      var t = localStorage.getItem('hashweb-kb-theme');
      var ok = ['gallery','editorial','poster','zen','terminal','nord','fable'];
      document.body.dataset.theme = ok.indexOf(t) >= 0 ? t : 'gallery';
    } catch (e) { document.body.dataset.theme = 'gallery'; }
  </script>
  <header>
    <div class="h-left">
      <button id="nav-toggle" title="pages">☰</button>
      <div class="brand">HASHWEB</div>
    </div>
    <div class="h-right">
      <div class="fig">FIG. 03 — KNOWLEDGE BASE ON A FLAT STORE OF OBJECTS</div>
      <button id="theme-toggle" title="cycle visual theme">◧ GALLERY</button>
      <button id="comments-toggle" title="comments">💬 <span id="ct-count">0</span></button>
    </div>
  </header>
  <div id="panel-backdrop"></div>
  <div id="toast"></div>
  <main>
    <nav id="sidebar">
      <div class="side-head"><span>PAGES</span><button id="new-page">+ NEW</button></div>
      <div id="tree"></div>
    </nav>
    <section id="editor-pane">
      <div id="crumbs"></div>
      <input id="image-file" type="file" accept="image/*" style="display:none">
      <div id="sel-toolbar">
        <button data-act="code" title="inline code (⌘E)"><span class="ic">&lt;/&gt;</span></button>
        <button data-act="math" title="inline math">∑</button>
        <button data-act="comment" title="comment on selection">💬</button>
        <button data-act="clear" title="clear formatting">⌫</button>
      </div>
      <div id="slash-menu"></div>
      <div id="work">
        <div id="page">
          <input id="title" placeholder="Untitled" spellcheck="false" autocomplete="off">
          <div id="conflict-bar"></div>
          <div class="fmt-hint">Select text to format · type <b>/</b> for blocks</div>
          <div id="blocks"></div>
        </div>
      </div>
      <div id="page-tools">
        <button id="new-subpage">+ SUBPAGE</button>
        <button id="delete-page" class="danger">DELETE PAGE</button>
      </div>
      <div id="no-page" style="display:none">no page selected — create one</div>
    </section>
    <aside id="comments" style="display:none"></aside>
  </main>
  <footer>
    <span>OBJECTS <b id="stat-objects">0</b></span>
    <span>SNAPSHOT <b id="stat-bytes">0 B</b></span>
    <span>PARKED <b id="stat-parked">0</b></span>
    <span id="sync-dot">● LIVE — open this page in a second tab to watch merge</span>
  </footer>
  <script type="module" src="./kb.js"></script>
</body>
</html>
